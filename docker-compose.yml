services:
  traefik:
    image: traefik:v3.1
    container_name: petbug-traefik
    # Traefik reads lab routes from ./traefik/dynamic. The file provider's
    # watcher does not receive inotify events for bind mounts on Docker Desktop
    # (Windows/macOS), so the API restarts this container after route changes
    # (TRAEFIK_RELOAD=restart, see server/src/services/docker.service.js).
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - type: bind
        source: ./traefik/dynamic
        target: /etc/traefik/dynamic
    networks:
      - petbug_net

  db:
    image: postgres:16-alpine
    container_name: petbug-db
    environment:
      POSTGRES_DB: bugpet
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: adminnnnnnnnnnnnnnnnnnnnnnNa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - petbug_net

  redis:
    image: redis:7-alpine
    container_name: petbug-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - petbug_net

networks:
  petbug_net:
    name: petbug_net
    driver: bridge

volumes:
  pgdata:
  redisdata:
